name: macOS installer preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - setup.sh
      - .github/release/standalone/**
      - scripts/posix-host-smoke.sh
      - docs/STANDALONE_DOCKER.md
      - docs/POSIX_HOST_SMOKE.md
      - .github/workflows/macos-installer-preflight.yml

concurrency:
  group: macos-installer-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            expected_arch: arm64
          - name: Intel
            runner: macos-15-intel
            expected_arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise the macOS installer surface
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          set -euo pipefail

          actual_arch="$(uname -m)"
          [[ "$actual_arch" == "$EXPECTED_ARCH" ]]
          sw_vers
          printf 'architecture=%s runner=%s\n' "$actual_arch" "$RUNNER_LABEL"

          for tool in sh git od tr id chmod mkdir cp grep awk stat; do
            command -v "$tool" >/dev/null || {
              echo "Required setup tool is unavailable on macOS: $tool" >&2
              exit 1
            }
          done

          posix_scripts=(setup.sh scripts/posix-host-smoke.sh .github/release/standalone/setup.sh .github/release/standalone/jscc.sh)
          for script in "${posix_scripts[@]}"; do
            git ls-files --stage "$script" | grep -E '^100755 ' >/dev/null
            [[ -x "$script" ]]
          done
          sh -n "${posix_scripts[@]}"
          if LC_ALL=C grep -n $'\r' "${posix_scripts[@]}"; then
            echo 'POSIX setup scripts must use LF line endings.' >&2
            exit 1
          fi

          spaced_clone="$RUNNER_TEMP/Job Search Command Center"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$spaced_clone"
          for script in "${posix_scripts[@]}"; do
            [[ -x "$spaced_clone/$script" ]]
          done
          sh -n "$spaced_clone/setup.sh" "$spaced_clone/scripts/posix-host-smoke.sh" \
            "$spaced_clone/.github/release/standalone/setup.sh" \
            "$spaced_clone/.github/release/standalone/jscc.sh"

          stub="$RUNNER_TEMP/jscc-docker-stub"
          mkdir -p "$stub"
          cat > "$stub/docker" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = info ]; then exit 1; fi
          exit 0
          EOF
          chmod +x "$stub/docker"
          if PATH="$stub:$PATH" "$spaced_clone/setup.sh" --folder "$RUNNER_TEMP/Workspace With Spaces" --empty > "$RUNNER_TEMP/docker-stopped.txt" 2>&1; then
            echo 'Setup unexpectedly succeeded while Docker was unavailable.' >&2
            exit 1
          fi
          grep -F 'Docker is installed but is not running.' "$RUNNER_TEMP/docker-stopped.txt" >/dev/null

          cat > "$stub/docker" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = info ]; then exit 0; fi
          if [ "${1:-}" = compose ] && [ "${2:-}" = version ]; then exit 1; fi
          exit 0
          EOF
          chmod +x "$stub/docker"
          if PATH="$stub:$PATH" "$spaced_clone/setup.sh" --folder "$RUNNER_TEMP/Compose Missing Workspace" --empty > "$RUNNER_TEMP/compose-missing.txt" 2>&1; then
            echo 'Setup unexpectedly succeeded without Docker Compose v2.' >&2
            exit 1
          fi
          grep -F 'Docker Compose v2 is required.' "$RUNNER_TEMP/compose-missing.txt" >/dev/null

          standalone_bundle="$RUNNER_TEMP/Standalone Bundle With Spaces"
          standalone_workspace="$RUNNER_TEMP/Standalone Workspace With Spaces"
          standalone_log="$RUNNER_TEMP/standalone-docker.log"
          mkdir -p "$standalone_bundle/gateway"
          cp "$spaced_clone/.github/release/standalone/setup.sh" \
            "$spaced_clone/.github/release/standalone/jscc.sh" \
            "$spaced_clone/.github/release/standalone/setup.ps1" \
            "$spaced_clone/.github/release/standalone/jscc.ps1" \
            "$standalone_bundle/"
          printf '%s\n' 'services: {}' > "$standalone_bundle/compose.yaml"
          printf '%s\n' 'services: {}' > "$standalone_bundle/compose.connected.yaml"
          printf '%s\n' 'events {}' > "$standalone_bundle/gateway/nginx.conf"
          printf '%s\n' '{}' > "$standalone_bundle/release-manifest.json"
          printf '%s\n' 'v1.0.0' > "$standalone_bundle/VERSION"
          : > "$standalone_bundle/SHA256SUMS"

          cat > "$stub/docker" <<EOF
          #!/bin/sh
          printf '%s\n' "\$*" >> "$standalone_log"
          exit 0
          EOF
          chmod +x "$stub/docker"
          PATH="$stub:$PATH" "$standalone_bundle/setup.sh" \
            --folder "$standalone_workspace" --empty
          grep -F 'APP_DISTRIBUTION_CHANNEL=standalone' "$standalone_workspace/.env" >/dev/null
          grep -F 'APP_CODEX_GUIDANCE_ENABLED=false' "$standalone_workspace/.env" >/dev/null
          grep -F 'compose ' "$standalone_log" | grep -F ' pull' >/dev/null
          grep -F 'up --detach --pull never --no-build --wait' "$standalone_log" >/dev/null
          [[ -x "$standalone_workspace/.jscc/jscc.sh" ]]

          docker_path="$(command -v docker || true)"
          docker_runtime=unavailable
          compose_runtime=unavailable
          if [ -n "$docker_path" ] && docker info >/dev/null 2>&1; then docker_runtime=available; fi
          if [ -n "$docker_path" ] && docker compose version >/dev/null 2>&1; then compose_runtime=available; fi
          cat > "$RUNNER_TEMP/macos-preflight.json" <<EOF
          {"passed":true,"commit":"$GITHUB_SHA","runner":"$RUNNER_LABEL","architecture":"$actual_arch","dockerCli":"${docker_path:-unavailable}","dockerRuntime":"$docker_runtime","composeRuntime":"$compose_runtime","scope":"source and standalone installers; clone, executable bits, LF/POSIX parsing, path with spaces, prerequisite messages, pull-only launch contract; no Docker Desktop runtime claim"}
          EOF

      - name: Preserve macOS preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-installer-preflight-${{ matrix.expected_arch }}
          path: ${{ runner.temp }}/macos-preflight.json
          if-no-files-found: error
          retention-days: 30
