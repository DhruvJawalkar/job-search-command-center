pid /tmp/nginx.pid;

events {}

http {
    access_log off;
    error_log /dev/stderr warn;
    # Resolve fixed Compose service names at request time so container
    # recreation does not leave Nginx pinned to a retired container address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 3000;
        set $portal_upstream portal:3000;

        location / {
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    server {
        listen 8080;
        set $api_upstream api:8080;

        location / {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }
}
