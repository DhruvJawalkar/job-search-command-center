services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_search}
      POSTGRES_USER: ${POSTGRES_USER:-job_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_search_local}
    volumes:
      - ${APP_DATA_ROOT:?Run setup.ps1 or setup.sh first}/postgres-data:/var/lib/postgresql/data
    networks:
      - local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_search} -d ${POSTGRES_DB:-job_search}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-job_search}
      DB_USERNAME: ${POSTGRES_USER:-job_search}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1 or setup.sh first}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:${APP_PORTAL_HOST_PORT:-3000},http://localhost:${APP_PORTAL_HOST_PORT:-3000}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-false}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-false}
      APP_DAILY_HIGH_FIT_IMPORT_ENABLED: "true"
      APP_DAILY_HIGH_FIT_FOLDER: /workspace/daily-high-fit-job-roles
      APP_LINKEDIN_CONNECTIONS_FILE: /workspace/linkedin-data-import/Connections.csv
      APP_APPLICATION_RESUMES_FOLDER: /workspace/application-resumes
      APP_NOTES_FOLDER: /workspace/notes
      APP_COMPANY_TARGETS_FOLDER: /workspace/company-targets
      APP_WORKSPACE_ROOT: /workspace
      APP_PREPARATION_WORKSPACE_FOLDER: /workspace/preparation-workspace
    volumes:
      - ${APP_DATA_ROOT}/application-resumes:/workspace/application-resumes
      - ${APP_DATA_ROOT}/notes:/workspace/notes
      - ${APP_DATA_ROOT}/daily-high-fit-job-roles:/workspace/daily-high-fit-job-roles
      - ${APP_DATA_ROOT}/linkedin-data-import:/workspace/linkedin-data-import
      - ${APP_DATA_ROOT}/preparation-workspace:/workspace/preparation-workspace
      - ${APP_DATA_ROOT}/company-targets:/workspace/company-targets
    networks:
      - local_only
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  portal:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${APP_API_HOST_PORT:-8080}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    networks:
      - local_only
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    image: nginx:1.29-alpine
    user: "101:101"
    entrypoint: []
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    configs:
      - source: gateway_config
        target: /etc/nginx/nginx.conf
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_API_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${APP_PORTAL_HOST_PORT:-3000}:3000"
    networks:
      - local_only
      - ingress
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  local_only:
    internal: true
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

configs:
  gateway_config:
    file: ./gateway/nginx.conf

