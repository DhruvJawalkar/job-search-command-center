spring:
  application:
    name: job-search-command-center
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/job_search}
    username: ${DB_USERNAME:job_search}
    password: ${DB_PASSWORD:job_search_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  version: ${APP_VERSION:1.0.0}
  distribution-channel: ${APP_DISTRIBUTION_CHANNEL:source}
  codex-guidance-enabled: ${APP_CODEX_GUIDANCE_ENABLED:true}
  connected:
    enabled: ${APP_CONNECTED_ENABLED:false}
    broker-base-url: ${APP_EGRESS_BROKER_BASE_URL:}
    broker-token: ${APP_EGRESS_BROKER_TOKEN:}
  privacy:
    workspace-root: ${APP_WORKSPACE_ROOT:..}
    preparation-workspace-folder: ${APP_PREPARATION_WORKSPACE_FOLDER:../preparation-workspace}
    cleanup:
      poll-delay: ${APP_PRIVACY_CLEANUP_POLL_DELAY:PT1H}
  seed-demo: ${APP_SEED_DEMO:false}
  demo-mode: ${APP_DEMO_MODE:false}
  application-artifacts:
    folder: ${APP_APPLICATION_RESUMES_FOLDER:../application-resumes}
  notes:
    folder: ${APP_NOTES_FOLDER:../notes}
  assistance:
    openai:
      model: ${APP_OPENAI_MODEL:}
  imports:
    daily-high-fit:
      enabled: ${APP_DAILY_HIGH_FIT_IMPORT_ENABLED:true}
      folder: ${APP_DAILY_HIGH_FIT_FOLDER:../daily-high-fit-job-roles}
    linkedin-connections:
      file: ${APP_LINKEDIN_CONNECTIONS_FILE:../linkedin-data-import/Connections.csv}
  cohorts:
    company-targets:
      folder: ${APP_COMPANY_TARGETS_FOLDER:..}
      filename-pattern: ${APP_COMPANY_TARGETS_PATTERN:*_Target_Companies.xlsx}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
