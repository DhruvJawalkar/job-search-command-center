spring:
  datasource:
    url: jdbc:h2:mem:jobsearch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  seed-demo: false
  application-artifacts:
    folder: target/test-application-resumes
  imports:
    daily-high-fit:
      enabled: false
      folder: target/test-daily-high-fit
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
