packages:
  - "."

# Avoid placing pnpm's large virtual store inside this OneDrive-backed workspace.
virtualStoreDir: ${LOCALAPPDATA}/pnpm/virtual-stores/job-search-command-center
confirmModulesPurge: false

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
