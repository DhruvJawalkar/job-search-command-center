packages:
  - "."

overrides:
  fast-uri: 3.1.6
  image-size: 2.0.3
  js-yaml: 4.3.2
  sharp: 0.35.4
  undici: 7.29.0
  ws: 8.21.0

confirmModulesPurge: false

# Release builds compile on the native builder platform, while the final
# runtime image may be linux/amd64 or linux/arm64. Retain the matching optional
# binaries for both supported container architectures plus the developer's
# current host architecture.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - musl

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
